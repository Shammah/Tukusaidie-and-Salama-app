<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08301F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Salama App">
<meta name="format-detection" content="telephone=no">
<title>Salama App</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Public+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one phone-width column; a dark green hero for landing, light working surfaces for the survey and results. */
:root{
  --bg:#EEF5F0; --surface:#FFFFFF; --ink:#0B3D2E; --muted:#56695F; --line:#D5E3DA;
  --brand:#0B3D2E; --on-brand:#FFFFFF; --accent:#12894D; --accent-tint:#DFF3E7;
  --hero:#08301F; --hero-ink:#FFFFFF; --hero-soft:#CBE8D6; --glass:rgba(255,255,255,.12); --glass-line:rgba(255,255,255,.22);
  --low:#17794A; --low-t:#DDF2E5; --med:#96600A; --med-t:#FBEFD5; --high:#B34A0B; --high-t:#FCE5D3; --crit:#B72B25; --crit-t:#FADEDC;
  --hd:#D4481F; --hd-t:#FFE8DC; --hd-on:#FFFFFF; --sun:#E0A800; --sun-t:#FFF3C9; --sun-ink:#8A6400;
  --s1:#22C55E; --s2:#FACC15; --s3:#2DD4BF; --sop:.3;
  --skin:#B9774C; --uniform:#14553B; --cap:#0A2E20; --badge:#F2C230;
  --display:"Bricolage Grotesque","Trebuchet MS",sans-serif; --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0A1B13; --surface:#12281D; --ink:#E9F5EE; --muted:#9DB5A8; --line:#254234;
  --brand:#2FBF76; --on-brand:#062114; --accent:#4FD08D; --accent-tint:#173A29;
  --hero:#061F14; --low:#5FD49A; --low-t:#143826; --med:#F0BF5A; --med-t:#3A2E12; --high:#F59A5C; --high-t:#40230F; --crit:#F58A84; --crit-t:#451A18;
  --hd:#FF8E63; --hd-t:#43210F; --hd-on:#2A0F03; --sun:#F2C230; --sun-t:#3D3209; --sun-ink:#F2C230;
  --sop:.2; --uniform:#1E7350; --cap:#0E3B29; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0A1B13; --surface:#12281D; --ink:#E9F5EE; --muted:#9DB5A8; --line:#254234;
  --brand:#2FBF76; --on-brand:#062114; --accent:#4FD08D; --accent-tint:#173A29;
  --hero:#061F14; --low:#5FD49A; --low-t:#143826; --med:#F0BF5A; --med-t:#3A2E12; --high:#F59A5C; --high-t:#40230F; --crit:#F58A84; --crit-t:#451A18;
  --hd:#FF8E63; --hd-t:#43210F; --hd-on:#2A0F03; --sun:#F2C230; --sun-t:#3D3209; --sun-ink:#F2C230;
  --sop:.2; --uniform:#1E7350; --cap:#0E3B29; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.app{max-width:460px;margin:0 auto;padding-inline:16px;padding-block:16px 96px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:30px} h2{font-size:23px} h3{font-size:16px}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:13px 16px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;min-width:0}
.btn.primary{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.btn:disabled{opacity:.45;cursor:default}
.muted{color:var(--muted)} .small{font-size:13px}

/* hero */
.hero{position:relative;overflow:hidden;background:var(--hero);color:var(--hero-ink);border-radius:28px;padding:22px 18px;display:flex;flex-direction:column;gap:14px}
.hero > *{position:relative}
.blob{position:absolute;border-radius:50%;filter:blur(60px);animation:drift 14s ease-in-out infinite alternate}
.b1{width:260px;height:260px;background:#22C55E;opacity:.7;top:-90px;right:-70px}
.b2{width:220px;height:220px;background:#86EFAC;opacity:.38;top:38%;left:-120px;animation-delay:-5s}
.b3{width:280px;height:280px;background:#10B981;opacity:.55;bottom:-130px;right:-60px;animation-delay:-9s}
.ghost{position:absolute;opacity:.1;stroke-width:1.2}
.brandrow{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:18px;font-weight:600}
.tile{width:40px;height:40px;border-radius:12px;background:var(--glass);display:grid;place-items:center;flex:none}
.hero p{color:var(--hero-soft)}
.seclist{display:flex;flex-direction:column;gap:8px;list-style:none;margin:0;padding:0}
.seclist li{display:flex;align-items:center;gap:12px;background:var(--glass);border:1px solid var(--glass-line);border-radius:14px;padding:9px 12px;animation:rise .5s both}
.seclist b{display:block;font-weight:600} .seclist span{font-size:12px;color:var(--hero-soft)}
.hero .btn{background:#FFFFFF;color:#0B3D2E;border-color:#FFFFFF}
.hero .link{background:none;border:0;color:var(--hero-ink);font-weight:600;padding:6px;text-decoration:underline}
.center{text-align:center}

/* register */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
label{font-weight:600;font-size:14px;display:flex;flex-direction:column;gap:6px}
input[type=text],input[type=email],input[type=password],input[type=search]{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px}
.sizes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.size{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.size[aria-pressed=true]{border-color:var(--accent);background:var(--accent-tint)}
.err{color:var(--crit);font-size:13px;font-weight:600}

/* survey */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted)}
.topbar button{background:none;border:0;color:var(--accent);font-weight:600;padding:4px}
.track{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.track i{display:block;height:100%;border-radius:3px;background:var(--accent);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-block:2px;scrollbar-width:thin}
.tab{flex:none;display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-size:12px;font-weight:600;color:var(--muted)}
.tab .ic{width:15px;height:15px}
.tab[aria-current=true]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.tab.done:not([aria-current=true]){border-color:var(--accent);color:var(--accent)}
.sechead{display:flex;align-items:center;gap:12px}
.secicon{width:48px;height:48px;border-radius:14px;background:var(--accent-tint);color:var(--accent);display:grid;place-items:center;flex:none}
.secicon .ic{width:26px;height:26px}
.secicon.enter{animation:pop .6s cubic-bezier(.2,1.4,.4,1)}
.a-pulse .ic{animation:pulse 1.8s ease-in-out infinite}
.a-wiggle .ic{animation:wiggle 2.4s ease-in-out infinite}
.a-bounce .ic{animation:bounce 1.6s ease-in-out infinite}
.a-float .ic{animation:float 2.6s ease-in-out infinite}
.a-ring .ic{animation:ring 1.4s ease-in-out infinite}
.a-tilt .ic{animation:tilt 3s ease-in-out infinite}
.qcard{animation:slide .35s both}
.qcard.back{animation-name:slideb}
.qcard h2{font-size:21px;line-height:1.25}
.guard{display:flex;align-items:flex-end;gap:8px}
.guard svg{width:66px;height:84px;flex:none;animation:bob 3s ease-in-out infinite}
.guard .arm{transform-origin:47px 52px;animation:wave 2.2s ease-in-out infinite}
.guard .eye{animation:blink 4s infinite;transform-origin:center;transform-box:fill-box}
.bubble{position:relative;background:var(--accent-tint);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:10px 12px;font-size:13.5px;min-width:0;animation:rise .4s both}
.bubble b{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:13px 14px;font-weight:500;transition:transform .12s,border-color .15s,background .15s}
.opt:active{transform:scale(.985)}
.opt i{width:20px;height:20px;border-radius:50%;border:2px solid var(--muted);flex:none;transition:all .15s}
.opt[aria-pressed=true]{border-color:var(--accent);background:var(--accent-tint);font-weight:600}
.opt[aria-pressed=true] i{border-color:var(--accent);background:var(--accent);box-shadow:inset 0 0 0 3px var(--accent-tint)}
.nav{display:grid;grid-template-columns:auto 1fr 1fr auto;gap:8px}
.nav .btn{padding:13px 12px}

/* results */
.score{flex-direction:row;align-items:center;gap:16px}
.ring{width:104px;height:104px;flex:none}
.ring circle{fill:none;stroke-width:10}
.ring .bgc{stroke:var(--line)}
.ring .fg{stroke-linecap:round;transform:rotate(-90deg);transform-origin:center;transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)}
.ring text{font-family:var(--display);font-weight:700;font-size:30px;fill:var(--ink)}
.chip{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:600;white-space:nowrap}
.l-low{background:var(--low-t);color:var(--low)} .l-med{background:var(--med-t);color:var(--med)} .l-high{background:var(--high-t);color:var(--high)} .l-crit{background:var(--crit-t);color:var(--crit)} .l-none{background:var(--line);color:var(--muted)}
.c-low{color:var(--low)} .c-med{color:var(--med)} .c-high{color:var(--high)} .c-crit{color:var(--crit)} .c-none{color:var(--muted)}
.rows{display:flex;flex-direction:column;gap:13px}
.row .top{display:flex;align-items:center;gap:8px;font-weight:500;margin-bottom:6px}
.row .top span.n{flex:1;min-width:0}
.row .num{font-weight:600;font-variant-numeric:tabular-nums;min-width:2ch;text-align:right}
.row .track i{background:currentColor}
.fix{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.fix li{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:3px}
.fix li:first-child{border-top:0;padding-top:0}
.fix .meta{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px;font-size:12px;color:var(--muted);align-items:center}


/* registration landing */
.orbit{width:150px;height:150px;align-self:center;display:grid;place-items:center}
.orbit .pr{position:absolute;inset:0;border:1.5px solid var(--glass-line);border-radius:50%;animation:radar 2.8s ease-out infinite}
.orbit .p2{animation-delay:1.4s}
.orbit .sweep{position:absolute;inset:14px;border-radius:50%;background:conic-gradient(from 0deg,rgba(134,239,172,.45),rgba(134,239,172,0) 28%);animation:spin 3.6s linear infinite}
.orbit .spin{position:absolute;inset:6px;animation:spin 16s linear infinite}
.orbit .sat{position:absolute;width:34px;height:34px;border-radius:50%;background:#0E4A33;border:1px solid var(--glass-line);display:grid;place-items:center;animation:spin 16s linear infinite reverse}
.orbit .sat .ic{width:17px;height:17px}
.orbit .s1{top:-8px;left:calc(50% - 17px)} .orbit .s2{bottom:10px;left:-6px} .orbit .s3{bottom:10px;right:-6px}
.orbit .core{position:relative;width:62px;height:62px;border-radius:20px;background:#FFFFFF;color:#0B3D2E;display:grid;place-items:center;animation:beat 2.8s ease-in-out infinite}
.orbit .core .ic{width:32px;height:32px}
.feats{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:start}
.feat{display:flex;flex-direction:column;align-items:flex-start;gap:5px;text-align:left;background:var(--glass);border:1px solid var(--glass-line);border-radius:16px;padding:12px;color:var(--hero-ink);min-width:0;transition:transform .2s,background .2s}
.feat b{font-family:var(--display);font-size:16px}
.feat.warm .tile{background:#F2C230;color:#3A2A00}
.feat .hint{font-size:11.5px;color:var(--hero-soft)}
.feat .more{display:block;max-height:0;opacity:0;overflow:hidden;font-size:12.5px;line-height:1.45;color:var(--hero-soft);transition:max-height .4s ease,opacity .3s}
.feat:hover,.feat:focus-visible,.feat[aria-expanded=true]{background:rgba(255,255,255,.2);transform:translateY(-2px)}
.feat:hover .more,.feat:focus-visible .more,.feat[aria-expanded=true] .more{max-height:220px;opacity:1}
.feat:hover .hint,.feat:focus-visible .hint,.feat[aria-expanded=true] .hint{display:none}
.feat:hover .tile{animation:jelly .6s}
.hero.tk{--hero:#4A1D0B;--hero-soft:#FBD9C4}
.tk .b1{background:#FB923C}.tk .b2{background:#FACC15}.tk .b3{background:#FB7185}
.hero.tk .btn{color:#4A1D0B}.tk .orbit .sat{background:#6B2A10}.tk .orbit .core{color:#B93A12}
.tk .orbit .sweep{background:conic-gradient(from 0deg,rgba(250,204,21,.5),rgba(250,204,21,0) 28%)}
.hero.tk .size[aria-pressed=true]{color:#4A1D0B}
.icorow{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}
.icorow .tile{width:34px;height:34px;border-radius:10px;animation:bounce 2.4s ease-in-out infinite}
.icorow .ic{width:17px;height:17px}
.icob{width:44px;height:44px;border-radius:50%;background:var(--glass);border:1px solid var(--glass-line);color:var(--hero-ink);display:grid;place-items:center;transition:transform .2s,background .2s}
.icob:hover{background:rgba(255,255,255,.24);transform:translateY(-2px)}
.hero .sizes .size{align-items:center;text-align:center}
.regform{display:flex;flex-direction:column;gap:12px}
.hero input[type=text],.hero input[type=password]{background:var(--glass);border-color:var(--glass-line);color:var(--hero-ink)}
.hero input::placeholder{color:var(--hero-soft);opacity:.75}
.hero .size{background:var(--glass);border-color:var(--glass-line);color:var(--hero-ink)}
.hero .size span{color:var(--hero-soft)}
.hero .size[aria-pressed=true]{background:#FFFFFF;border-color:#FFFFFF;color:#0B3D2E}
.hero .size[aria-pressed=true] span{color:#3F5A4D}
.hero .err{color:#FFD3CE}
.ovlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.ovlist li{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px;animation:rise .45s both}
.ovlist b{display:block}
@keyframes radar{from{transform:scale(.42);opacity:.95}to{transform:scale(1.08);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes beat{50%{transform:scale(1.07)}}

/* helpdesk: warmer palette and bouncier motion than the cyber check */
.hd{--accent:var(--hd);--accent-tint:var(--hd-t);--brand:var(--hd);--on-brand:var(--hd-on);display:flex;flex-direction:column;gap:14px}
.mod{display:flex;align-items:center;gap:14px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:16px;animation:popin .5s cubic-bezier(.2,1.5,.4,1) both}
.mod.hd{flex-direction:row;animation-delay:.1s}
.mod b{display:block;font-family:var(--display);font-size:18px}
.mod:active,.cat:active{transform:scale(.97)}
.hdhero{position:relative;background:var(--hd-t);border-radius:22px;padding:14px;overflow:hidden}
.hdhero .bubble{background:var(--surface)}
.spark{position:absolute;width:10px;height:10px;border-radius:3px;background:var(--sun);animation:twirl 3s ease-in-out infinite}
.k1{top:10px;right:18px}.k2{bottom:12px;right:40%;background:var(--hd);animation-delay:-1s;width:7px;height:7px}.k3{top:16px;left:44%;animation-delay:-2s;border-radius:50%}
.catgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:12px;min-width:0;animation:popin .5s cubic-bezier(.2,1.5,.4,1) both;transition:transform .15s,border-color .15s}
.cat:hover{border-color:var(--hd)} .cat:hover .caticon{animation:jelly .6s}
.cat b{font-size:14px;line-height:1.25}
.caticon{width:38px;height:38px;border-radius:12px;background:var(--hd-t);color:var(--hd);display:grid;place-items:center;margin-bottom:2px}
.cat:nth-child(3n+2) .caticon{background:var(--sun-t);color:var(--sun-ink)}
.hres{display:flex;flex-direction:column;gap:6px}
.hres:empty{display:none}
.hit{display:flex;align-items:center;gap:10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 12px;color:var(--ink)}
.hit .ic{color:var(--hd)}
.issue{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;animation:popin .45s cubic-bezier(.2,1.4,.4,1) both}
.issue[open]{border-color:var(--hd)}
.issue summary{cursor:pointer;font-weight:600;padding:14px;display:flex;align-items:center;gap:10px;list-style:none}
.issue summary::-webkit-details-marker{display:none}
.issue summary::before{content:"+";color:var(--hd);font-weight:700;width:12px;flex:none;text-align:center}
.issue[open] summary::before{content:"\2212"}
.issue .st{flex:1;min-width:0}
.fee{flex:none;background:var(--hd-t);color:var(--hd);border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.feebox{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--hd-t);border-radius:14px;padding:12px}
.price{font-family:var(--display);font-weight:700;font-size:18px;color:var(--hd);white-space:nowrap;font-variant-numeric:tabular-nums}
.quote .feebox{animation:popin .5s cubic-bezier(.2,1.5,.4,1) both}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.till{font-family:var(--display);font-size:18px;color:var(--hd);letter-spacing:.08em}
.mini{display:inline-block;margin-top:4px;border:1px solid var(--hd);background:none;color:var(--hd);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600}
.hero .link.quiet{font-size:12.5px;font-weight:500;opacity:.8}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--accent-tint);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;min-width:0}
.stat span{font-size:12px;color:var(--muted)} .stat b{font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.trow{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.btn.sm{padding:8px 12px;border-radius:10px;font-size:13px}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.prow{display:flex;align-items:flex-end;gap:8px}
.prow label{flex:1;min-width:0;font-size:12px;color:var(--muted)}
.prow input{padding:8px 10px;font-variant-numeric:tabular-nums}
.offer{background:var(--high-t);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.asec{background:var(--surface);border:1px solid var(--line);border-radius:16px}
.asec summary{cursor:pointer;display:flex;align-items:center;gap:8px;padding:12px 14px;font-weight:600;list-style:none}
.asec summary::-webkit-details-marker{display:none}
.asec .st{flex:1;min-width:0} .asec .num{font-variant-numeric:tabular-nums;min-width:2ch;text-align:right}
.qa{list-style:none;margin:0;padding:0 14px 12px;display:flex;flex-direction:column;gap:8px}
.qa li{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;border-top:1px solid var(--line);padding-top:8px;font-size:13.5px}
.qa li>span:first-child{min-width:0}
.catgrid{align-items:start}
div.cat{position:relative;padding:0;display:block}
.catb{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:18px;padding:10px 30px 10px 10px;font-weight:600;font-size:13.5px;line-height:1.25;min-width:0}
.catb .caticon{margin:0;flex:none}
.catb:hover .caticon{animation:jelly .6s}
.cati{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:12px;font-weight:700;line-height:1;display:grid;place-items:center;padding:0}
.catd{display:block;max-height:0;opacity:0;overflow:hidden;padding:0 10px;font-size:12.5px;color:var(--muted);transition:max-height .3s,opacity .25s,padding .3s}
.cat:hover .catd,.cat:focus-within .catd,.cat.open .catd{max-height:90px;opacity:1;padding:0 10px 10px}
.askf{display:flex;flex-direction:column;gap:8px;background:var(--sun-t);border-radius:14px;padding:12px}
.askf textarea{background:var(--surface)}
.rates{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.rates li{display:flex;align-items:center;gap:10px;animation:rise .45s both}
.rates .price{font-size:15px}
.wbar{height:10px;border-radius:5px;background:var(--hd);flex:none}
.issue summary::marker{color:var(--hd)}
.ibody{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px;animation:rise .35s both}
.tag{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--hd);margin-bottom:2px}
.tag.ok{color:var(--low)}
.prios{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.prios .size{padding:10px 8px}
textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;resize:vertical}
.tlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.tlist li{display:flex;gap:10px;align-items:flex-start}
.done{position:relative;overflow:hidden;animation:popin .5s cubic-bezier(.2,1.5,.4,1) both}
.confetti i{position:absolute;top:-12px;width:8px;height:14px;border-radius:2px;animation:fall 1.6s ease-in both}
@keyframes popin{from{transform:scale(.8) translateY(10px);opacity:.2}}
@keyframes jelly{30%{transform:scale(1.2,.85)}60%{transform:scale(.9,1.12)}}
@keyframes twirl{50%{transform:rotate(180deg) scale(1.5)}}
@keyframes fall{to{transform:translateY(420px) rotate(540deg);opacity:0}}


/* animated scene behind every page, loader, chat, agents */
.scene{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;filter:hue-rotate(var(--hue,0deg));transition:filter 1.2s}
.sb{position:absolute;border-radius:50%;filter:blur(70px);opacity:var(--sop);transition:background 1.2s}
.g1{width:60vmax;height:60vmax;background:var(--s1);top:-28vmax;left:-22vmax;animation:ga 17s ease-in-out infinite alternate}
.g2{width:55vmax;height:55vmax;background:var(--s2);bottom:-28vmax;right:-24vmax;animation:gb 21s ease-in-out infinite alternate}
.g3{width:36vmax;height:36vmax;background:var(--s3);top:35%;left:30%;animation:gc 25s ease-in-out infinite alternate}
.fl{position:absolute;bottom:-70px;color:var(--s1);opacity:.3;animation:floatup linear infinite}
body[data-scene=cyber]{--s1:#22C55E;--s2:#5EEAD4;--s3:#FDE047}
body[data-scene=help]{--s1:#FB923C;--s2:#FACC15;--s3:#FB7185}
body[data-scene=admin]{--s1:#38BDF8;--s2:#818CF8;--s3:#34D399}
body[data-scene=agent]{--s1:#A78BFA;--s2:#2DD4BF;--s3:#F472B6}
.app{position:relative;z-index:1}
.loader{position:fixed;inset:0;z-index:6;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 88%,transparent);animation:fadein .15s both}
.loadbox{display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:600;font-family:var(--display);font-size:17px;text-align:center;padding:0 24px}
.loadbox .guard svg{width:84px;height:106px;animation:hop .26s ease-in-out infinite alternate}
.dots{display:flex;gap:6px}.dots i{width:9px;height:9px;border-radius:50%;background:var(--accent);animation:dot .6s ease-in-out infinite alternate}.dots i:nth-child(2){animation-delay:.15s;background:var(--hd)}.dots i:nth-child(3){animation-delay:.3s;background:var(--sun)}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:4;width:56px;height:56px;border-radius:50%;border:0;background:var(--hd);color:var(--hd-on);display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.28);animation:fabpulse 2.6s ease-in-out infinite}
.fab .ic{width:26px;height:26px}
.msgs{display:flex;flex-direction:column;gap:8px}
.msg{max-width:86%;background:var(--surface);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:8px 12px;align-self:flex-start;display:flex;flex-direction:column;animation:popin .3s both;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--accent-tint);border-radius:14px 14px 4px 14px}
.chatbox{display:flex;gap:8px}.chatbox input{flex:1;min-width:0}.chatbox .btn{flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
fieldset{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;margin:0;min-width:0}
legend{font-weight:600;font-size:14px;padding:0 6px}
.cks{display:flex;flex-wrap:wrap;gap:6px}
label.ck{flex-direction:row;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:12.5px;font-weight:500;cursor:pointer}
label.ck:has(input:checked){background:var(--accent-tint);border-color:var(--accent)}
.ck input{accent-color:var(--accent);margin:0}
select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px;width:100%}
.arow{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:10px}
.linkrow{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
@keyframes ga{to{transform:translate(22vmax,16vmax) scale(1.25)}}
@keyframes gb{to{transform:translate(-20vmax,-18vmax) scale(.8)}}
@keyframes gc{to{transform:translate(-18vmax,12vmax) scale(1.4)}}
@keyframes floatup{to{transform:translateY(-120vh) rotate(60deg)}}
@keyframes fadein{from{opacity:0}}
@keyframes hop{to{transform:translateY(-10px)}}
@keyframes dot{to{transform:translateY(-7px)}}
@keyframes fabpulse{50%{transform:scale(1.08)}}

@keyframes drift{to{transform:translate(24px,18px) scale(1.12)}}
@keyframes rise{from{transform:translateY(8px);opacity:.3}}
@keyframes pop{from{transform:scale(.4) rotate(-20deg)}}
@keyframes slide{from{transform:translateX(26px);opacity:.2}}
@keyframes slideb{from{transform:translateX(-26px);opacity:.2}}
@keyframes pulse{50%{transform:scale(1.18);opacity:.65}}
@keyframes wiggle{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-12deg)}80%{transform:rotate(10deg)}90%{transform:rotate(-6deg)}}
@keyframes bounce{50%{transform:translateY(-4px)}}
@keyframes float{50%{transform:translateY(-3px) translateX(2px)}}
@keyframes ring{0%,100%{transform:rotate(0)}25%{transform:rotate(14deg)}75%{transform:rotate(-14deg)}}
@keyframes tilt{50%{transform:rotate(6deg) scale(1.06)}}
@keyframes bob{50%{transform:translateY(-3px)}}
@keyframes wave{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-22deg)}85%{transform:rotate(8deg)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* fading colour change when a button is hovered or focused, before it is clicked */
.btn,.tab,.opt,.size,.cat,.catb,.cati,.mod,.hit,.mini,.icob,.issue,.fab,.topbar button{transition:background-color .4s ease,border-color .4s ease,color .4s ease,box-shadow .4s ease,transform .2s ease}
@media (hover:hover){
.btn:hover:not(:disabled){background:var(--accent-tint);border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-tint)}
.btn.primary:hover:not(:disabled){background:color-mix(in srgb,var(--brand) 72%,var(--sun));border-color:transparent}
.btn.danger:hover:not(:disabled){background:var(--crit-t);border-color:var(--crit);box-shadow:0 0 0 3px var(--crit-t)}
.tab:hover:not([aria-current=true]){background:var(--accent-tint);border-color:var(--accent);color:var(--accent)}
.opt:hover,.size:hover,.mod:hover{background:var(--accent-tint);border-color:var(--accent)}
div.cat:hover{background:var(--hd-t);border-color:var(--hd);box-shadow:0 0 0 3px var(--hd-t)}
.cati:hover{background:var(--hd);border-color:var(--hd);color:var(--hd-on)}
.issue:not([open]):hover{background:var(--hd-t);border-color:var(--hd)}
.hit:hover,.mini:hover{background:var(--hd-t);border-color:var(--hd)}
.topbar button:hover{color:var(--ink)}
.fab:hover{background:color-mix(in srgb,var(--hd) 70%,var(--sun))}
.hero .btn:hover:not(:disabled){background:var(--hero-soft);border-color:var(--hero-soft);box-shadow:0 0 0 4px rgba(255,255,255,.18)}
.hero .size:hover:not([aria-pressed=true]){background:rgba(255,255,255,.26);border-color:#FFFFFF}
.hero .size[aria-pressed=true]:hover{background:#FFFFFF;border-color:#FFFFFF}
.hero .icob:hover{background:#FFFFFF;color:var(--hero);border-color:#FFFFFF}
}
.btn:focus-visible:not(.primary),.opt:focus-visible,.catb:focus-visible{background:var(--accent-tint)}

/* calmer Tukusaidie landing */
.hero.tk{--hero:#33241C;--hero-soft:#E9D5C6}
.tk .b1{background:#D9853F;opacity:.4}.tk .b2{background:#D9B95A;opacity:.24}.tk .b3{background:#C9766B;opacity:.3}
.tk .blob{animation-duration:28s}
.tk .ghost{opacity:.05}
.tk h1{font-size:23px;font-weight:600}
.tk .orbit{width:104px;height:104px}
.tk .orbit .sweep,.tk .orbit .pr{display:none}
.tk .orbit .spin,.tk .orbit .sat{animation-duration:44s}
.tk .orbit .sat{width:28px;height:28px;background:#4A342A}
.tk .orbit .s1{left:calc(50% - 14px)}
.tk .orbit .core{width:48px;height:48px;border-radius:16px;animation:none;color:#33241C}
.tk .orbit .core .ic{width:24px;height:24px}
.tk .icorow .tile{animation:none;opacity:.7}
.hero.tk .btn,.hero.tk .size[aria-pressed=true]{color:#33241C}
.hero .ltabs{justify-content:center}
.hero .tab{background:var(--glass);border-color:var(--glass-line);color:var(--hero-ink);padding:7px 16px;font-size:13px}
.hero .tab[aria-current=true]{background:#FFFFFF;border-color:#FFFFFF;color:#33241C}
.hero .tabs .tab:hover:not([aria-current=true]){background:rgba(255,255,255,.26);border-color:#FFFFFF;color:#FFFFFF}
.locbox{display:flex;flex-direction:column;gap:8px;border:1px dashed var(--line);border-radius:14px;padding:12px}
.locbox #locmsg:empty{display:none}
a{color:var(--accent)}
p .ic{width:15px;height:15px;vertical-align:-2px}
.best{background:var(--low-t);border-radius:14px;padding:12px;font-size:14px}
.best .tag{color:var(--low)}
.shops{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:14px;padding:12px}
.shops .locmsg:empty{display:none}
.townf{display:flex;gap:6px}.townf input{flex:1;min-width:0;padding:8px 10px}
.shopc{display:flex;flex-direction:column;gap:3px;border-top:1px solid var(--line);padding-top:8px}
/* page change: old page slides and fades out, new page slides in */
#app{view-transition-name:page}
::view-transition-old(page){animation:vtout .26s ease-in both}
::view-transition-new(page){animation:vtin .42s cubic-bezier(.2,.8,.2,1) both}
html[data-dir=back]::view-transition-old(page){animation-name:vtoutb}
html[data-dir=back]::view-transition-new(page){animation-name:vtinb}
::view-transition-old(root),::view-transition-new(root){animation-duration:.45s}
.pin{animation:vtin .42s cubic-bezier(.2,.8,.2,1) both}.pinb{animation:vtinb .42s cubic-bezier(.2,.8,.2,1) both}
@keyframes vtout{to{opacity:0;transform:translateX(-36px)}}
@keyframes vtin{from{opacity:0;transform:translateX(48px)}}
@keyframes vtoutb{to{opacity:0;transform:translateX(36px)}}
@keyframes vtinb{from{opacity:0;transform:translateX(-48px)}}
@media (prefers-reduced-motion: reduce){::view-transition-old(page),::view-transition-new(page),::view-transition-old(root),::view-transition-new(root){animation:none}}

.hero.tk::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(51,36,28,.38),rgba(51,36,28,.78) 52%,rgba(51,36,28,.92));z-index:0}
.hero.tk{isolation:isolate}.hero.tk>*{z-index:1}.hero.tk>.photo{z-index:-1}.hero.tk>.blob,.hero.tk>.ghost{z-index:0}
@keyframes kenburns{to{transform:scale(1.14) translate(-10px,-6px)}}
.more{border-top:1px solid var(--line);padding-top:8px}
.more>summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--hd);list-style:none}
.more>summary::-webkit-details-marker{display:none}
.more>summary::before{content:"+ "}.more[open]>summary::before{content:"\2212  "}
.more>.ibody{padding:10px 0 0}
#locmsg:empty{display:none}
/* Tukusaidie: one warm palette on every page, including agent, shop and admin sign-in */
html.app-t{--accent:var(--hd);--accent-tint:var(--hd-t);--brand:var(--hd);--on-brand:var(--hd-on)}
html.app-t .tab[aria-current=true]{background:var(--hd);border-color:var(--hd);color:var(--hd-on)}
html.app-t .stat{background:var(--hd-t)}
html.app-t label.ck:has(input:checked){background:var(--hd-t);border-color:var(--hd)}
html.app-t .ck input{accent-color:var(--hd)}
/* Tukusaidie landing fills the screen */
.hero.tk{min-height:calc(100svh - 32px);justify-content:center}
.hero.tk>.brandrow{margin-bottom:auto}
.hero.tk>.linkrow{margin-top:auto}
.hero.tk h1{font-size:27px}
@media (max-width:500px){.hero.tk{margin:-16px -16px -96px;border-radius:0;min-height:100svh;padding:28px 20px calc(24px + env(safe-area-inset-bottom,0px))}}
/* fit each screen: compact services grid, folding sections, one-line admin rows */
html.app-t .catgrid{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
html.app-t .catb{flex-direction:column;align-items:center;text-align:center;gap:6px;padding:12px 6px 10px;font-size:12px}
html.app-t .catb .caticon{width:36px;height:36px}
html.app-t .cati{width:18px;height:18px;font-size:10px;top:4px;right:4px}
html.app-t div.cat .catd{position:absolute;top:calc(100% + 4px);left:-8px;right:-8px;z-index:5;max-height:none;padding:8px 10px;background:var(--ink);color:var(--bg);border-radius:10px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .2s}
html.app-t div.cat:hover .catd,html.app-t div.cat:focus-within .catd,html.app-t div.cat.open .catd{opacity:1;padding:8px 10px}
.trow.nowrap{flex-wrap:nowrap}.btn.grow{flex:1}
.mtabs{flex-wrap:wrap;overflow:visible}
details.fold{border:1px solid var(--line);border-radius:14px;padding:10px 12px}
details.card.fold{padding:14px 16px;border-radius:20px}
.fold>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::after{content:"\25BE";margin-left:auto;color:var(--accent)}
.fold[open]>summary::after{content:"\25B4"}
.cnt{font-size:12px;color:var(--accent);font-weight:600}
.foldb{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.fold>form{margin-top:10px}
details.acard{display:block}
.acard>summary{cursor:pointer;list-style:none;display:flex;flex-direction:column;gap:4px}
.acard>summary::-webkit-details-marker{display:none}
.acard>summary::after{content:"Show details \25BE";font-size:12px;font-weight:600;color:var(--accent)}
.acard[open]>summary::after{content:"Hide \25B4"}
.acbody{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.amt{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}
/* keep the hover description above neighbouring tiles */
html.app-t div.cat{z-index:1}
html.app-t div.cat:hover,html.app-t div.cat:focus-within,html.app-t div.cat.open{z-index:30}
html.app-t .catgrid{position:relative;z-index:2}
/* services tiles: no hover description and no info button */
html.app-t div.cat .catd,html.app-t div.cat .cati{display:none!important}
/* minimal landing */
.lmin{display:flex;flex-direction:column;min-height:calc(100svh - 32px);padding:40px 12px 8px}
.lmin .logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}
.lmin .logo span{width:36px;height:36px;border-radius:10px;background:var(--hd);color:#fff;display:grid;place-items:center}
.lmin h1{font-size:46px;line-height:1.02;letter-spacing:-.03em;margin:auto 0 16px;font-weight:800}
.lmin h1 em{font-style:normal;color:var(--hd)}
.lmin p{font-size:16px;color:var(--muted);margin:0 0 22px;line-height:1.5}
.lmin .pts{display:flex;flex-direction:column;gap:10px;margin-bottom:auto;font-size:14.5px}
.lmin .pts div{display:flex;gap:10px;align-items:center}.lmin .pts .ic{color:var(--hd);width:18px;height:18px}
.lmin .go1{margin-top:30px;background:var(--ink);color:var(--bg);border:0;border-radius:16px;padding:17px;font-weight:700;font-size:16px}
.lmin .go2{background:none;border:0;color:var(--ink);font-weight:600;font-size:15px;padding:14px}
.lmin .staff{display:flex;justify-content:center;gap:8px;margin-top:6px}
.lmin .staff button{display:flex;align-items:center;gap:6px;background:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12.5px;color:var(--muted)}
.lmin .staff .ic{width:15px;height:15px}
@media (max-width:500px){.lmin{margin:-16px -16px -96px;padding:52px 28px calc(24px + env(safe-area-inset-bottom,0px));min-height:100svh;background:var(--bg)}}
/* super-app services home */
.sapp{gap:16px}
.shead{display:flex;justify-content:space-between;align-items:center;gap:12px}.shead h2{font-size:24px;margin-top:2px}
.bellb{position:relative;width:44px;height:44px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink);flex:none}
.bellb i{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;border-radius:9px;background:var(--hd);color:#fff;font-size:11px;font-style:normal;font-weight:700;display:grid;place-items:center;padding:0 4px}
.sapp #hsearch{border-radius:16px;background:var(--surface);padding:14px}
.sgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 8px}
.sgt{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;font-size:11.5px;font-weight:600;color:var(--ink);text-align:center;padding:0;line-height:1.2}
.sgt span{width:58px;height:58px;border-radius:18px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--hd);transition:background-color .3s,border-color .3s,transform .2s}
.sgt span .ic{width:24px;height:24px}
.sgt:hover span{background:var(--hd-t);border-color:var(--hd);transform:translateY(-2px)}
.sbanner{background:#33241C;color:#FFFFFF;border-radius:22px;padding:18px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.sbanner b{display:block;font-size:18px;font-family:var(--display)}.sbanner small{color:#E9D5C6;font-size:12.5px}
.sbanner button{background:#F7A26B;border:0;border-radius:12px;padding:10px 16px;font-weight:700;color:#33241C;flex:none}
.ssec{display:flex;justify-content:space-between;align-items:center}
.linkb{background:none;border:0;color:var(--hd);font-weight:600;font-size:13px;padding:4px}
.shopr{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px;text-decoration:none;color:var(--ink)}
.shopr .ico{width:42px;height:42px;border-radius:14px;background:var(--hd-t);color:var(--hd);display:grid;place-items:center;flex:none}
.shopr b{display:block;font-size:14px}.shopr small{color:var(--muted);font-size:12px}
/* services page: two columns on laptops and desktops */
.scol1,.scol2{display:flex;flex-direction:column;gap:16px;min-width:0}
@media (min-width:900px){
 body[data-view=helpdesk] .app{max-width:1080px}
 .sapp{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);column-gap:32px;align-items:start}
 .sapp .sgrid{grid-template-columns:repeat(6,minmax(0,1fr))}
 .sapp .scol2{position:sticky;top:20px}
}
/* Tukusaidie dark mode: warm browns instead of the green defaults */
@media (prefers-color-scheme: dark){html.app-t:not([data-theme="light"]){--bg:#16110E;--surface:#221A15;--ink:#F6EDE6;--muted:#BCA99B;--line:#3A2D25;--hd-t:#3D2214}}
html.app-t[data-theme="dark"]{--bg:#16110E;--surface:#221A15;--ink:#F6EDE6;--muted:#BCA99B;--line:#3A2D25;--hd-t:#3D2214}

/* ===== fit every screen like an installed app ===== */
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;height:100%}
body{margin:0;min-height:100%;min-height:100dvh;overflow-x:hidden;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
img,svg,video{max-width:100%}
.app{width:100%;box-sizing:border-box;min-height:100dvh;
 padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right));
 padding-top:max(16px,env(safe-area-inset-top))}
input,select,textarea{font-size:max(16px,1em)}
.btn,button{touch-action:manipulation}
@media (max-width:599px){.app{max-width:none}}
@media (min-width:600px) and (max-width:899px){.app{max-width:720px}
 html.app-t .sgrid{grid-template-columns:repeat(4,minmax(0,1fr));gap:18px 12px}
 html.app-t .catgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (min-width:900px){.app{max-width:960px}}
/* fluid sizes so text and tiles scale with the screen */
html.app-t .shead h2{font-size:clamp(22px,6vw,30px)}
.lmin h1{font-size:clamp(38px,12vw,64px)}
.sgt span{width:clamp(52px,15vw,64px);height:clamp(52px,15vw,64px)}
.sgt{font-size:clamp(11px,3vw,13px)}
/* phones: landing and sign-in fill edge to edge */

<script>
const APP='salama',IS_S=APP==='salama',APPNAME=IS_S?'Salama App':'Tukusaidie',HOME=IS_S?'overview':'helpdesk';
const OFF=IS_S?['helpdesk','mytix','hcat','ticket','quote','nego','pay','tdone','chat','glogin','agent','slogin','shop','reg']:['overview','survey','results'];
/* Question format: [action if this is a gap, question, why the guard asks, weight (2 = essential), audience: A all, L large only] */
const SECTIONS=[
{id:'net',name:'Network and WiFi',icon:'wifi',anim:'pulse',qs:[
['Change the WiFi password from the default','Is your office WiFi protected by a strong password that is different from the one printed on the router?','Default router passwords are easy to look up. Anyone in range can join your network.',2,'A'],
['Change the router or Starlink admin login','Has the admin login for your router or Starlink kit been changed from the factory default?','Whoever controls the router can watch or redirect all your traffic.',2,'A'],
['Set up a separate guest WiFi','Do visitors and customers use a separate guest WiFi from the one your work devices use?','A visitor\'s infected phone should never sit on the same network as your accounts computer.',1,'A'],
['Switch on the firewall','Is a firewall switched on at your internet connection?','A firewall blocks unwanted connections from the internet before they reach your devices.',1,'A'],
['Give remote staff a secure connection','Do staff use a VPN or other secure connection when working from home, a cyber cafe or public WiFi?','Public WiFi can be read by others. A VPN keeps work traffic private.',1,'A'],
['Segment the network','Is your network split so guest, staff, server and CCTV traffic are kept apart?','Segments stop one infected device from reaching everything else.',1,'L'],
['Monitor network alerts','Does someone review network logs or alerts for unusual activity?','Most break-ins leave traces days before the damage. Someone has to be looking.',1,'L']]},
{id:'acc',name:'Accounts and passwords',icon:'lock',anim:'wiggle',qs:[
['Turn on two-step verification for email','Do all staff use two-step verification on work email?','Also called 2FA or MFA. A stolen password alone is then not enough to get in.',2,'A'],
['Remove leavers\' accounts the same day','Are accounts disabled on the day a staff member leaves?','Old accounts are a favourite way back in, for outsiders and unhappy former staff.',2,'A'],
['Give every person their own login','Does each staff member have their own login, with no shared accounts?','With shared logins you cannot tell who did what, or remove one person\'s access.',1,'A'],
['Use unique passwords or a password manager','Do staff use a password manager or a different password for each system?','One reused password leaked from another site can open every system you have.',1,'A'],
['Limit admin rights','Are admin rights limited to the few people who need them?','Malware runs with the rights of whoever opened it. Fewer admins means less damage.',1,'A'],
['Adopt single sign-on','Do you use single sign-on or central identity management?','One place to add, change and remove access is far easier to keep right.',1,'L'],
['Review access rights regularly','Are access rights reviewed at least every 6 months?','People change roles and keep old access unless someone checks.',1,'L']]},
{id:'staff',name:'Staff awareness',icon:'users',anim:'bounce',qs:[
['Teach staff to spot phishing','Can staff spot phishing emails and scam messages on WhatsApp and SMS?','Most attacks start with a message that tricks a person, not a technical break-in.',2,'A'],
['Verify changes to payment details by phone','Do you confirm any request to change a supplier\'s bank or paybill details by calling a number you already know?','Fraudsters send convincing emails asking you to pay a "new" account.',2,'A'],
['Run yearly security training','Have staff had cybersecurity training in the last 12 months?','Scams change every year. Training keeps people current.',1,'A'],
['Name a person to report to','Do staff know who to tell when they see something suspicious?','A quick report can stop an attack. Silence lets it spread.',1,'A'],
['Brief new staff in week one','Are new staff briefed on security rules in their first week?','New starters are targeted because they do not yet know what normal looks like.',1,'A'],
['Run phishing simulations','Do you run simulated phishing tests?','Practice with safe fake emails shows who needs more help.',1,'L']]},
{id:'dev',name:'Devices and updates',icon:'laptop',anim:'tilt',qs:[
['Turn on automatic updates','Are computers and phones set to install updates automatically?','Updates close holes that attackers already know how to use.',2,'A'],
['Install antivirus on every computer','Is antivirus protection active on every computer?','It catches most common malware before it runs.',2,'A'],
['Replace cracked software','Is all your software properly licensed, with no cracked copies?','Cracked software is a leading source of malware and gets no security updates.',2,'A'],
['Lock every device','Do all work phones and laptops lock with a PIN, password or fingerprint?','An unlocked lost phone hands over email, files and payment apps.',1,'A'],
['Encrypt laptops and phones','Are laptops and phones encrypted?','Encryption keeps data unreadable if the device is stolen.',1,'A'],
['Keep a device register','Do you keep a list of company devices and who holds each one?','You cannot protect or recover what you do not know you own.',1,'A'],
['Control USB sticks','Is the use of personal USB sticks controlled or scanned?','Flash disks carry malware between home, cyber cafes and the office.',1,'A'],
['Set up remote lock and wipe','Can you remotely lock or wipe a lost device?','Device management lets you protect data after a device is gone.',1,'L']]},
{id:'bak',name:'Backups and recovery',icon:'cloud',anim:'float',qs:[
['Back up important files automatically','Are important files backed up automatically at least once a week?','Ransomware, theft or a failed disk can wipe out years of records.',2,'A'],
['Keep one backup offsite or offline','Is one backup copy kept away from the office or offline?','Fire, theft or ransomware can take the backup too if it sits next to the original.',2,'A'],
['Test a restore','Have you tested restoring from a backup in the last 6 months?','A backup you have never restored is only a hope.',1,'A'],
['Include accounting and POS records','Are your accounting, ERP or point-of-sale records included in the backup?','These are the records the business and KRA will ask for first.',1,'A'],
['Prepare for power and internet outages','Can you keep working through a power or internet outage?','A UPS and a second connection keep sales and records running.',1,'A'],
['Write a recovery plan','Do you have a written recovery plan with target times?','It tells everyone what to restore first and how long it should take.',1,'L']]},
{id:'mpesa',name:'M-Pesa and mobile payments',icon:'phone',anim:'ring',qs:[
['Restrict who knows the M-Pesa PIN','Is your M-Pesa PIN known only to authorised people and never shared by call, SMS or WhatsApp?','Nobody genuine will ever ask for your PIN, including callers who say they are from Safaricom.',2,'A'],
['Confirm payments on your own line','Do staff confirm each payment on your own till, app or statement before releasing goods?','Fake confirmation SMS and edited screenshots are a common way to steal stock.',2,'A'],
['Refuse reversal requests by phone','Do staff know not to send money back when a caller claims a payment was sent by mistake?','In this scam the "mistaken" payment was never real, or is reversed again afterwards.',2,'A'],
['Protect the business line from SIM swap','Have you asked your mobile provider about SIM swap protection for the business line?','A fraudulent SIM swap moves your number, and your M-Pesa, to a criminal\'s phone.',2,'A'],
['Reconcile M-Pesa against sales','Are M-Pesa records checked against sales every day or week?','Regular checks expose missing money and insider fraud early.',1,'A'],
['Assign the payment phone to a named person','Is the phone holding the business line locked and kept by a named person?','A shared, unlocked payment phone makes theft easy and impossible to trace.',1,'A'],
['Separate who starts and who approves payments','Does one person start a large payment or withdrawal and a different person approve it?','Two people make both mistakes and fraud much harder.',1,'A'],
['Limit withdrawals to approved accounts','Are till or paybill withdrawals limited to approved numbers or your business bank account?','It stops funds being moved to a personal line.',1,'A'],
['Give each portal operator their own login','Does each operator on the M-Pesa business portal have their own login and role?','Named operators give you an audit trail and let you remove one person cleanly.',1,'L'],
['Secure your M-Pesa API keys','If you use the M-Pesa (Daraja) APIs, are keys stored securely, rotated and callbacks validated?','Leaked API keys or unchecked callbacks let attackers fake or redirect payments.',2,'L']]},
{id:'data',name:'Data protection',icon:'file',anim:'tilt',qs:[
['Register with the ODPC if required','Are you registered with the Office of the Data Protection Commissioner where the law requires it?','Kenya\'s Data Protection Act requires many organisations to register. Check whether yours is one.',2,'A'],
['Lock away personal data','Are ID copies, payroll and customer lists locked away or limited to those who need them?','Personal data is what criminals sell and what the law holds you responsible for.',2,'A'],
['List the personal data you hold','Do you know what personal data you hold on customers and staff?','Names, ID numbers, phone numbers and M-Pesa records all count.',1,'A'],
['Tell customers how you use their data','Do you tell customers how their data is used and get consent where needed?','People have a legal right to know. A short notice is usually enough.',1,'A'],
['Destroy old records safely','Do you shred paper records and wipe old devices before disposal?','Old phones, disks and files in the bin leak data.',1,'A'],
['Add data terms to supplier contracts','Do contracts with suppliers who handle your data include data protection terms?','You stay responsible for data even when a supplier holds it.',1,'L'],
['Name a data protection officer','Have you appointed a data protection officer or a named responsible person?','Someone must own compliance and be the contact for the regulator.',1,'L'],
['Assess new systems for privacy risk','Do you carry out data protection impact assessments for new systems?','It is required for high-risk processing and catches problems before launch.',1,'L']]},
{id:'inc',name:'Incident response',icon:'bell',anim:'ring',qs:[
['Write a one-page incident plan','Do you have a written list of what to do and who to call if you are hacked or defrauded?','In a crisis nobody thinks clearly. A simple list saves hours.',2,'A'],
['Know where to report','Do you know how to report fraud to your bank or Safaricom, the police, the national KE-CIRT/CC and the ODPC?','A personal data breach must be reported to the ODPC within 72 hours.',1,'A'],
['Make lost devices reportable at once','Do staff know how to report a lost or stolen device immediately?','The first hour is when you can still lock accounts and SIMs.',1,'A'],
['Record incidents and lessons','Do you keep a record of past incidents and what you changed afterwards?','The same trick tends to be tried again.',1,'A'],
['Run an incident drill','Have you practised an incident drill in the last year?','A drill shows the gaps in the plan while nothing is at stake.',1,'L'],
['Arrange cyber insurance or a reserve','Do you have cyber insurance or money set aside for an incident?','Recovery, legal advice and downtime cost money quickly.',1,'L']]},
{id:'gov',name:'Governance and suppliers',icon:'case',anim:'float',large:true,qs:[
['Make a senior person accountable','Is a senior manager or board member accountable for cybersecurity?','Without an owner at the top, security loses every budget discussion.',2,'L'],
['Approve a security policy','Is there a written information security policy that is reviewed every year?','It sets the rules everyone else is measured against.',1,'L'],
['Add cyber risks to the risk register','Are cyber risks reviewed in your regular risk register?','It keeps security in front of management alongside other business risks.',1,'L'],
['Vet key suppliers','Do you check the security of key suppliers and cloud providers before signing?','Attackers often come in through a weaker supplier.',1,'L'],
['Commission independent testing','Do you have independent security testing or an audit at least once a year?','Outsiders find what the team that built it cannot see.',1,'L'],
['Follow a recognised standard','Do you follow a recognised standard such as ISO 27001 or your sector regulator\'s guidance?','A standard gives structure and evidence for customers and regulators.',1,'L']]}
];
const OPTS=[['yes','Yes',1],['partly','Partly',.5],['no','No',0],['unsure','Not sure',0],['na','Does not apply',null]];
const LABEL={yes:'Yes',partly:'Partly',no:'No',unsure:'Not sure',na:'Does not apply'};
const LEVELS=[[80,'Low','low'],[60,'Medium','med'],[45,'High','high'],[0,'Critical','crit']];
const level=s=>s==null?['Not answered','none']:LEVELS.find(l=>s>=l[0]).slice(1);

let S={view:'landing',size:'S',biz:'',answers:{},idx:0,dir:'',lastSec:''};
try{const r=JSON.parse(localStorage.getItem((IS_S?'cyberCheck':'tukusaidie'))||'null');if(r&&r.answers)S=Object.assign(S,r,{dir:'',lastSec:''});}catch(e){}
/* always open on the landing page; #reset clears everything saved in this browser */
if(location.hash==='#reset'){try{localStorage.removeItem(IS_S?'cyberCheck':'tukusaidie');}catch(e){}S={view:'landing',size:'S',biz:'',answers:{},idx:0,dir:'',lastSec:''};}
S.view='landing';
if(S.biz&&S.regBiz===undefined)S.regBiz=S.biz;
const persist=()=>{if(S.regBiz){S.all=S.all||{};S.all[S.regBiz]={size:S.size,answers:S.answers};}try{localStorage.setItem((IS_S?'cyberCheck':'tukusaidie'),JSON.stringify(S));}catch(e){}};
let downloads=null;
if(window.claude&&window.claude.use){window.claude.use('downloads').then(d=>{downloads=d;if(S.view==='results')render();}).catch(()=>{});}

const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ic=(n,cls='')=>`<svg class="ic ${cls}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
function flat(size=S.size){const out=[];SECTIONS.forEach(sec=>sec.qs.forEach((q,i)=>{if(q[4]==='A'||size==='L')out.push({sec,key:sec.id+i,action:q[0],text:q[1],why:q[2],w:q[3]});}));return out;}
const count=(sec,size)=>sec.qs.filter(q=>q[4]==='A'||size==='L').length;

function scoreOf(list,A=S.answers){let got=0,max=0;list.forEach(q=>{const a=A[q.key];const o=OPTS.find(o=>o[0]===a);if(!o||o[2]==null)return;got+=o[2]*q.w;max+=q.w;});return max?Math.round(got/max*100):null;}
function summary(){const qs=flat();const secs=SECTIONS.map(sec=>{const l=qs.filter(q=>q.sec===sec);return l.length?{sec,score:scoreOf(l),n:l.length,done:l.filter(q=>S.answers[q.key]).length}:null;}).filter(Boolean);
  const gaps=qs.filter(q=>['no','unsure','partly'].includes(S.answers[q.key])).sort((a,b)=>b.w-a.w||(S.answers[a.key]==='partly')-(S.answers[b.key]==='partly'));
  return{qs,secs,overall:scoreOf(qs),gaps,answered:qs.filter(q=>S.answers[q.key]).length};}

const GUARD=`<svg viewBox="0 0 66 84" role="img" aria-label="Security guard guide">
<ellipse cx="33" cy="80" rx="18" ry="3" fill="var(--line)"/>
<rect x="17" y="46" width="32" height="30" rx="9" fill="var(--uniform)"/>
<rect x="27" y="46" width="12" height="9" fill="var(--surface)"/><path d="M33 47v8" stroke="var(--cap)" stroke-width="3"/>
<path d="M22 56l4-3 4 3v4c0 3-2 4-4 5-2-1-4-2-4-5z" fill="var(--badge)"/>

function tkForm(){const m=S.lmode||'new';return `<nav class="tabs ltabs" aria-label="Customer access"><button class="tab" data-lmode="new" aria-current="${m==='new'}">Register</button><button class="tab" data-lmode="in" aria-current="${m==='in'}">Sign in</button></nav>

    <label for="cphone">Phone number<input type="text" inputmode="tel" id="cphone" placeholder="0712 345 678" autocomplete="tel"></label>
    <label for="cpass">Password<input type="password" id="cpass" autocomplete="${m==='new'?'new-password':'current-password'}"></label>
    <p class="err" id="cerr" hidden></p>
    <button class="btn primary" type="submit">${m==='new'?'Register free':'Sign in'}</button>
  </form>`;}
async function doCust(m){const er=document.getElementById('cerr'),fail=x=>{er.textContent=x;er.hidden=false;};S.custs=S.custs||{};
  const ph=normPhone(document.getElementById('cphone').value),pw=document.getElementById('cpass').value;let biz;
  if(m==='new'){biz=document.getElementById('biz').value.trim();if(!biz)return fail('Enter the business name.');
    if(!/^0[17]\d{8}$/.test(ph))return fail('Enter a Kenyan mobile number, for example 0712 345 678.');
    if(S.custs[ph])return fail('This number is already registered. Sign in instead.');
    if(pw.length<8)return fail('Choose a password of at least 8 characters.');
    S.custs[ph]={biz,hash:await sha(ph+':'+pw)};}
  else{const c=S.custs[ph];if(!c||c.hash!==await sha(ph+':'+pw))return fail('Phone number or password is not right.');biz=c.biz;}
  S.biz=S.regBiz=biz;S.phone=ph;S.view='home';render();window.scrollTo(0,0);}

srv:[["Check the storage box has power and its network light is on.","Restart your computer and try again by its network address.","If one person is locked out, it is a permissions issue. If everyone is, it is the box or network.","A clicking sound or red disk light means stop and raise a ticket at once."],
["Pick the folders and systems that must be backed up.","Choose where copies go: a storage box in the office and one copy off-site or in the cloud.","The agent schedules the backup to run automatically, usually at night.","A test restore is done so you know it works."],
["Check the power cable, socket and UPS first.","Note any error on the screen, beeps or coloured lights.","Do not reinstall or reset anything, as that can destroy data.","The agent diagnoses on-site and recovers data before any repair."]],

["Find the registrar from old invoices or emails.","Sign in and renew straight away, for more than one year if you can.","Turn on auto-renew and update the contact email.","If it has already lapsed, the agent helps with recovery, which can cost more the longer it is left."],
["Choose the provider, for example Google Workspace or Microsoft 365.","The agent verifies your domain with the provider.","Mail records are changed so email arrives in the new mailboxes.","Each person gets an account, a strong password and two-step verification."]],
mail:[["Open the sign-in page and choose Forgot password.","Follow the code sent to your recovery phone or email.","Choose a new password you have not used before.","Update it on your phone and tablet straight away."],
["Stop trying for 15 minutes so the lock can clear.","Check Caps Lock and type the password slowly once.","Update the password on every device that checks your mail.","If it locks again quickly, an old device or someone else is trying it."],
["Look in Spam for missing mail and in Outbox for stuck mail.","Check your mailbox is not full and delete large old messages.","Send large files as a shared link instead of an attachment.","Ask the other person to check the address they used."],
["Decide the address name and who will use it.","Get your manager's approval.","The agent creates it and sets who can read and send.","You sign in and change the temporary password."]],
pc:[["Restart, do not only close the lid.","Close programs and browser tabs you are not using.","Free up disk space: empty the bin and clear Downloads.","If it is slow from the moment it starts, too many programs launch at startup."],
["Try another socket and, if possible, another charger.","Hold the power button for 15 seconds, release, then press once.","Unplug everything attached and try again.","A charging light with no screen points to the display, not the power."],
["Photograph the error screen, including the code.","Recall what changed: a new device, program or update.","Let the machine cool, then restart.","If it happens more than once, stop using it for important work until it is checked."],
["Move it to a hard, flat surface so the vents are clear.","Close heavy programs and restart.","Listen for the fan. No fan sound with high heat needs a technician.","Dust build-up is cleaned by opening the machine, which is a job for the agent."]],
print:[["Check the printer is on, has paper and shows no error.","Confirm you chose the right printer in the print window.","Open the print queue and cancel every waiting job.","Turn the printer off and on, then print one test page."],
["Switch the printer off.","Open the covers and pull the paper gently in the direction it travels.","Check for torn scraps left inside.","Reload with a fresh, fanned stack and do not overfill the tray."],
["Remove the toner or ink cartridge and rock it gently side to side.","Refit it firmly until it clicks.","Run the cleaning cycle from the printer's menu.","If prints are still faint, the cartridge needs replacing."],
["Scan to a USB stick so work can continue.","Check whether the email password the printer uses was changed recently.","The agent updates the printer's mail settings.","A test scan is sent to confirm."]],
apps:[["Name the program and what you need it for.","Get approval if it costs money.","The agent checks it is safe and properly licensed.","It is installed remotely and tested with you."],
["Refresh the page and try again.","Sign out and back in.","Screenshot the exact error and note what you were doing.","Check whether colleagues see the same thing. If so, it is the system, not you."],
["Save your work if you can.","Close other programs to free memory.","Install pending updates for that program.","If one file causes it, the file may be damaged or too large."],
["Note the program and the exact message.","Check whether a renewal email arrived.","Use the web version, if there is one, to keep working.","The agent confirms the subscription and reassigns the licence."]],
mobile:[["Open the mail app's account settings.","Enter the new password.","Check mobile data or WiFi is on and working.","Remove and re-add the account if it still will not sync."],
["Delete old messages to free inbox space.","Restart the phone and check signal bars.","Check the balance from the M-Pesa menu instead of waiting for the SMS.","Take the SIM out, wipe it gently and refit it."],
["Restart the phone and check aeroplane mode is off.","Try the SIM in another phone.","If it shows no service there too, call the provider from another line immediately.","Ask them directly whether a SIM swap was done. If yes, treat it as fraud."]],
sec:[["Do not click links, open attachments or reply.","Check the sender's real address, not only the display name.","Forward it to IT, then delete it.","Warn colleagues if it looks aimed at your company."],

["Let the antivirus finish and note the name of what it found.","Do not plug in USB sticks or open downloads.","Restart only when the scan says it is safe.","The agent checks whether anything else was affected."],
["Report it immediately with where and when you last had it.","IT locks or wipes the device remotely if that is set up.","Change your email and system passwords.","For a phone, call the mobile provider to block the SIM."]],
people:[["Send the name, role, start date and manager at least three days ahead.","List the systems and folders they need.","The agent creates accounts and prepares a device.","On day one they sign in, change passwords and set up two-step verification."],
["Tell IT the last working day as soon as it is known.","List what they had: laptop, phone, access cards.","Accounts are disabled at the end of the last day.","Their mail and files are handed to the manager."],
["Name the system or folder and why access is needed.","Get the owner's or manager's approval.","The agent grants the minimum needed.","Say when it is no longer needed so it can be removed."]],
hw:[["Say what you need and whether the old one is broken.","Hand in the faulty item if asked.","The agent issues a replacement from stock or orders one.","It is recorded against your name."],
["Check the cable at both ends, or try another cable.","Connect another screen to see whether the laptop itself is fine.","Photograph the damage.","The agent quotes for repair or replacement. Parts are charged separately."],
["Describe the work you do and the programs you use.","Get your manager's approval.","The agent recommends a specification and price.","Your files and settings are moved across from the old machine."]],
files:[["Open the Recycle Bin or Drive Bin.","Search for the file name, then restore it.","If it is not there, check with whoever shares the folder.","Older deletions may need restoring from backup, which the agent can do."],
["Check you are signed in with your work account.","Ask the folder owner to share it with you again.","Try opening it from the link they send.","If the folder was moved, the agent finds the new location."],
["Empty the bin.","Sort files by size and delete or move the largest.","Clear Downloads and duplicate videos.","Move old projects to the shared archive."]],
av:[["Check the mute button in the call and on the headset.","Open the call's audio settings and choose the right microphone.","Allow microphone access when the browser asks.","Rejoin the call, or restart the computer if it still fails."],
["Check both ends of the HDMI cable.","Choose the correct HDMI input on the projector or TV.","Press Windows + P and choose Duplicate.","Try another cable or laptop to find which part is at fault."],

    <div style="min-width:0;display:flex;flex-direction:column;gap:6px;align-items:flex-start"><span class="chip l-${lc}">Overall risk: ${lv}</span>
    <p class="small muted">${r.answered} of ${r.qs.length} questions answered. ${urgent?`${urgent} section${urgent>1?'s':''} at high or critical level.`:r.overall!=null?'No section is at high or critical level.':''}</p></div>
  </div>
  <div class="card"><h3>Critical level by section</h3>
    <div class="rows">${r.secs.map(s=>{const [l,c]=level(s.score);return `<div class="row c-${c}"><div class="top">${ic(s.sec.icon)}<span class="n" style="color:var(--ink)">${s.sec.name}</span><span class="chip l-${c}">${l}</span><span class="num" style="color:var(--ink)">${s.score??'–'}</span></div><div class="track"><i style="width:0" data-w="${s.score||0}"></i></div></div>`;}).join('')}</div>
    <div class="legend"><span class="chip l-low">Low 80+</span><span class="chip l-med">Medium 60 to 79</span><span class="chip l-high">High 45 to 59</span><span class="chip l-crit">Critical under 45</span></div>
  </div>
  <div class="card"><h3>Fix list (${r.gaps.length})</h3>
    ${r.gaps.length?`<ol class="fix">${r.gaps.map(g=>`<li><div class="meta"><span class="chip ${g.w===2?'l-crit':'l-med'}">${g.w===2?'Essential':'Recommended'}</span>${g.sec.name} · you said ${LABEL[S.answers[g.key]].toLowerCase()}</div><b>${esc(g.action)}</b><span class="small muted">${esc(g.why)}</span></li>`).join('')}</ol>`:`<p class="muted">${r.answered?'No gaps in the questions you answered.':'Answer some questions to build your fix list.'}</p>`}
  </div>
  <button class="btn" id="dl" ${downloads?'':'hidden'}>${ic('down')}Download my answers (CSV)</button>
  <p class="small muted center" id="dlmsg">${downloads?'':'Downloading is not available in this view.'}</p>
  <button class="btn" data-reset="1">Start a new check</button>
  <p class="small muted">This is a self-assessment guide, not a formal audit or legal advice.</p>`;}

function render(){const V={landing:vLanding,home:vHome,overview:vOverview,survey:vSurvey,results:vResults,helpdesk:vHelp,hcat:vCat,mytix:vMyTix,ticket:vTicket,quote:vQuote,nego:vNego,pay:vPay,tdone:vDone,alogin:vALogin,admin:vAdmin,chat:vChat,glogin:vGLogin,agent:vAgent,slogin:vSLogin,shop:vShop,reg:vReg};if(S.view==='home')S.view=S.regBiz?HOME:'landing';if(OFF.includes(S.view))S.view=S.regBiz?HOME:'landing';if(S.view==='admin'&&!ADMIN)S.view='alogin';if(S.view==='agent'&&!(AGENT&&agentBy(AGENT)))S.view='glogin';if(S.view==='shop'&&!(SHOP&&shopBy(SHOP)))S.view='slogin';if(!V[S.view]||(!['landing','reg','alogin','admin','glogin','agent','slogin','shop'].includes(S.view)&&!S.regBiz))S.view='landing';const paint=()=>{app.innerHTML=V[S.view]();stage();
  if(S.view==='results')requestAnimationFrame(()=>requestAnimationFrame(()=>{app.querySelectorAll('[data-w]').forEach(e=>e.style.width=e.dataset.w+'%');const f=app.querySelector('.fg');if(f)f.style.strokeDashoffset=f.dataset.to;}));
  if(S.view==='survey'){const cur=app.querySelector('.tab[aria-current=true]');if(cur&&cur.scrollIntoView)cur.parentNode.scrollLeft=cur.offsetLeft-cur.parentNode.offsetLeft-40;}};
  const changed=lastView!==null&&lastView!==S.view,calm=matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(changed&&!calm){const back=(DEPTH[S.view]??1)<(DEPTH[lastView]??1);document.documentElement.dataset.dir=back?'back':'fwd';
    if(document.startViewTransition){try{document.startViewTransition(paint);}catch(e){paint();}}
    else{paint();app.classList.remove('pin','pinb');void app.offsetWidth;app.classList.add(back?'pinb':'pin');}}
  else paint();
  persist();}
const DEPTH={landing:0,reg:1,alogin:1,glogin:1,slogin:1,home:1,overview:1,helpdesk:1,admin:2,agent:2,shop:2,survey:2,hcat:2,mytix:2,chat:3,results:3,ticket:3,quote:4,nego:5,pay:5,tdone:6};
let autoT=0;
function go(i,dir){clearTimeout(autoT);S.dir=dir||(i<S.idx?'back':'');S.idx=i;render();window.scrollTo(0,0);}

function csv(){const r=summary();const c=v=>'"'+String(v).replace(/"/g,'""')+'"';const rows=[['Business',S.biz],['Type',S.size==='L'?'Large company':'Small business'],['Overall score',r.overall??''],['Overall risk level',level(r.overall)[0]],[],['Section','Section score','Critical level','Question','Answer','Essential']];
  r.qs.forEach(q=>{const s=r.secs.find(x=>x.sec===q.sec);rows.push([q.sec.name,s.score??'',level(s.score)[0],q.text,LABEL[S.answers[q.key]]||'Not answered',q.w===2?'Yes':'No']);});
  return '﻿'+rows.map(r=>r.map(c).join(',')).join('\r\n');}

app.addEventListener('click',async e=>{const t=e.target.closest('button');if(!t)return;
  const D=t.dataset,find=id=>(S.tickets||[]).find(k=>k.id===id);

    else if(D.aoffer){const [a,id]=D.aoffer.split(':'),k=find(id);if(k){if(a==='accept'){k.fee=k.offer;k.status='accepted';S.amsg=[id,'Offer accepted. The customer can now pay '+ksh(k.fee)+'.'];}else{k.status='quote';S.amsg=[id,'Offer declined. The customer sees the original price again.'];}delete k.offer;}}

    else if(D.agact){const [a,id]=D.agact.split(':'),g=agentBy(id);if(g){if(a==='approve')g.status='approved';else if(a==='suspend')g.status='suspended';else if(a==='del')S.agdel=id;else if(a==='delyes'){S.agents=agents().filter(x=>x.id!==id);(S.tickets||[]).forEach(k=>{if(k.agent===id)assign(k,'');});S.agdel=null;}}}

    else if(D.admin==='out'){ADMIN=false;S.view='landing';}
    else if(D.admin==='seed'&&ADMIN)seed();
    else if(D.admin==='unseed'&&ADMIN){S.tickets=(S.tickets||[]).filter(k=>!k.sample);Object.keys(S.all||{}).forEach(n=>{if(S.all[n].sample)delete S.all[n];});const gone=agents().filter(a=>a.sample).map(a=>a.id);S.agents=agents().filter(a=>!a.sample);S.tickets.forEach(k=>{if(gone.includes(k.agent))assign(k,'');});Object.keys(S.chats||{}).forEach(n=>{if(n.startsWith('Sample: '))delete S.chats[n];});S.shops=shops().filter(x=>!x.sample);}
    rerenderKeep();return;}
  if(D.mh){const [k,v]=D.mh.split('|');S.mh=S.mh||{};S.mh[k]=v;rerenderKeep();return;}
  if(D.reg){S.lmode=D.reg;S.view='reg';render();window.scrollTo(0,0);return;}
  if(D.allcats){S.allcats=!S.allcats;render();return;}
  if(D.allshops){S.allshops=!S.allshops;render();return;}
  if(D.info){t.closest('.cat').classList.toggle('open');return;}
  if(D.loc){const m=document.getElementById('locmsg')||(t.closest('.shops')&&t.closest('.shops').querySelector('.locmsg')),say=x=>{if(m)m.textContent=x;};
    if(!navigator.geolocation){say('This device cannot share its location. Type your town or building instead.');return;}
    say('Finding your location...');
    try{navigator.geolocation.getCurrentPosition(p=>{S.loc={lat:+p.coords.latitude.toFixed(5),lng:+p.coords.longitude.toFixed(5),acc:Math.round(p.coords.accuracy)};persist();say('Location saved, accurate to about '+S.loc.acc+' m.');if(S.view==='hcat')rerenderKeep();},
      e=>{say(e&&e.code===1?'Location access was not allowed here. Type your town or building instead.':'Could not find your location. Type your town or building instead.');},{enableHighAccuracy:true,timeout:12000,maximumAge:60000});}
    catch(e){say('Location is not available here. Type your town or building instead.');}
    return;}
  if(D.smode){S.smode=D.smode;render();return;}
  if(D.sout){SHOP=null;S.view='landing';render();window.scrollTo(0,0);return;}
  if(D.stab){S.stab=D.stab;render();return;}
  if(D.sidel){const s=shopBy(SHOP);if(s){s.items.splice(+D.sidel,1);}render();return;}
  if(D.shloc){const s=shopBy(SHOP),m=document.getElementById('shlocmsg'),say=x=>{if(m)m.textContent=x;};if(!navigator.geolocation){say('This device cannot share its location.');return;}say('Finding the shop location...');
    try{navigator.geolocation.getCurrentPosition(p=>{s.loc={lat:+p.coords.latitude.toFixed(5),lng:+p.coords.longitude.toFixed(5)};persist();say('Map location saved. Customers can get directions to the exact spot.');},e=>say(e&&e.code===1?'Location access was not allowed here. Customers will get directions by town and name.':'Could not find the location. Try again outside or near a window.'),{enableHighAccuracy:true,timeout:12000});}catch(e){say('Location is not available here.');}
    return;}
  if(D.lmode){const b=document.getElementById('biz');if(b)S.biz=b.value;S.lmode=D.lmode;render();return;}

  if(D.gtab){S.gtab=D.gtab;render();return;}
  if(D.rbiz){S.rbiz=D.rbiz;render();return;}

app.addEventListener('submit',e=>{e.preventDefault();if(e.target.dataset.ask){const [c,i]=e.target.dataset.ask.split(':'),cat=HELP.find(x=>x.id===c),v=e.target.querySelector('textarea').value.trim();if(!v){e.target.querySelector('.err').hidden=false;return;}thread(S.regBiz).push({from:'c',topic:cat.issues[i][0],text:v,when:now()});S.prev='hcat';S.view='chat';render();window.scrollTo(0,0);return;}
  if(e.target.id==='al'){doLogin();return;}
  if(e.target.dataset.townf){S.place=e.target.querySelector('input').value.trim();rerenderKeep();return;}
  if(e.target.id==='snew'||e.target.id==='sin'){doShop(e.target.id==='snew'?'new':'in',e.target);return;}
  if(e.target.id==='scats'){const s=shopBy(SHOP);s.cats=[...e.target.querySelectorAll('input[name=scat]:checked')].map(i=>i.value);s.items=s.items.filter(i=>s.cats.includes(i.cat));render();return;}
  if(e.target.id==='sitem'){const s=shopBy(SHOP),n=document.getElementById('iname').value.trim(),c=document.getElementById('icat').value,pr=document.getElementById('iprice').value.replace(/[^0-9]/g,''),er=document.getElementById('ierr');if(!n||!c){er.textContent=!c?'Pick at least one problem area under Problems you can fix first.':'Enter the service name.';er.hidden=false;return;}s.items.push({name:n,cat:c,price:pr?+pr:null});render();return;}
  if(e.target.id==='srec'){const s=shopBy(SHOP),n=document.getElementById('rname').value.trim(),a=+document.getElementById('ramt').value.replace(/[^0-9]/g,''),er=document.getElementById('rerr');if(!n||!a){er.textContent=!n?'Enter the customer name.':'Enter the amount charged.';er.hidden=false;return;}s.records.push({cust:n,phone:normPhone(document.getElementById('rphone').value),service:document.getElementById('rserv').value,amount:a,when:now()});render();return;}
  if(e.target.id==='sprof'){const s=shopBy(SHOP);s.town=document.getElementById('ptown').value.trim()||s.town;s.address=document.getElementById('paddr').value.trim();render();return;}
  if(e.target.id==='creg'||e.target.id==='cin'){doCust(e.target.id==='creg'?'new':'in');return;}

  if(e.target.id==='ng'){const t=curT();const v=Number(document.getElementById('offer').value.replace(/[^0-9.]/g,''));const er=document.getElementById('ngerr');if(!v||v<=0){er.textContent='Enter your offer as a number.';er.hidden=false;return;}if(v>=t.fee){er.textContent='Your offer should be below '+ksh(t.fee)+'. To pay that, accept the price instead.';er.hidden=false;return;}t.offer=Math.round(v);t.offerNote=document.getElementById('ngnote').value.trim();t.status='negotiating';S.view='tdone';render();window.scrollTo(0,0);return;}
